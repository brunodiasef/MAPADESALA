<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mapa de Sala — E.E.E.F.M. Ilda Ferreira da Fonseca Martins</title>
<meta name="description" content="Mapa de sala por turno e turma — E.E.E.F.M. Ilda Ferreira da Fonseca Martins">
<meta name="theme-color" content="#152B1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mapa de Sala">
<link id="apple-touch-icon" rel="apple-touch-icon">
<link id="manifest-link" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (banco de dados compartilhado opcional — veja FIREBASE_CONFIG no script principal, no final do arquivo) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --green-900:#152B1E;
    --green-800:#1E3B29;
    --green-700:#2A4F37;
    --green-600:#37653F;
    --chalk:#EFD98B;
    --chalk-dim:#C9B573;
    --paper:#F4EEDC;
    --paper-line:#DFD3AC;
    --paper-line-strong:#C9B988;
    --wood:#C8934F;
    --wood-dark:#9C6B34;
    --wood-light:#E3B679;
    --gray-light:#EAECEF;
    --gray-light2:#D6DAE0;
    --navy-dark:#3A5A87;
    --navy-dark2:#2E4B72;
    --ink:#2B2418;
    --ink-soft:#5B523E;
    --white:#FFFFFF;
    --danger:#A9432E;
    --danger-dim:#7A2F21;
    --shadow: 0 6px 18px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--green-900);
    font-family:'Work Sans', system-ui, Arial, sans-serif;
    color: var(--ink);
    min-height:100vh;
  }

  /* ---------- HEADER ---------- */
  header.app-header{
    background: linear-gradient(180deg, var(--green-800), var(--green-900));
    border-bottom: 3px solid var(--green-600);
    padding: 22px 28px 16px;
    position:relative;
  }
  header.app-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-3px; height:3px;
    background: repeating-linear-gradient(90deg, var(--chalk-dim) 0 14px, transparent 14px 28px);
    opacity:.35;
  }
  .header-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  }
  .school-name{
    font-family:'Zilla Slab', Georgia, serif;
    font-weight:700;
    color: var(--chalk);
    font-size: clamp(19px, 4.6vw, 30px);
    letter-spacing:.3px;
    margin:0;
    text-shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  .school-sub{
    color: #B9C9B8;
    font-size:12.5px;
    margin-top:4px;
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .btn-install{
    flex:none;
    background: var(--chalk);
    color: var(--green-900);
    border:none;
    font-weight:700;
    font-size:13px;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .btn-install:hover{ filter:brightness(1.06); }
  .btn-install:active{ transform: translateY(1px); }
  .btn-install[hidden]{ display:none; }

  /* ---------- TABS ---------- */
  nav.tabbar{
    display:flex;
    align-items:flex-end;
    gap:4px;
    background: var(--green-800);
    padding: 10px 24px 0;
    overflow-x:auto;
    border-bottom: 1px solid var(--green-700);
  }
  .tab{
    display:flex; align-items:center; gap:8px;
    padding:9px 14px;
    background: var(--green-700);
    color:#DCE7DA;
    border-radius:8px 8px 0 0;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    border:1px solid transparent;
    border-bottom:none;
    transition: background .15s ease, color .15s ease;
  }
  .tab:hover{ background: var(--green-600); }
  .tab.active{
    background: var(--paper);
    color: var(--ink);
    font-weight:600;
    border-color: var(--paper-line-strong);
  }
  .tab .dot{
    width:8px; height:8px; border-radius:50%; flex:none;
  }
  .tab .close{
    margin-left:2px;
    width:18px; height:18px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1;
    color: inherit;
    opacity:.65;
  }
  .tab .close:hover{ background: rgba(0,0,0,.15); opacity:1; }
  .tab.home .close{ display:none; }

  /* ---------- MAIN ---------- */
  main{
    background: var(--paper);
    min-height: calc(100vh - 140px);
    padding: 28px;
  }
  .panel{
    max-width: 760px;
    margin: 10px auto 0;
    background: var(--white);
    border: 1px solid var(--paper-line-strong);
    border-radius: 14px;
    padding: 28px 30px;
    box-shadow: var(--shadow);
  }
  .panel h2{
    font-family:'Zilla Slab', Georgia, serif;
    font-size:22px;
    margin:0 0 4px;
    color: var(--green-800);
  }
  .panel p.hint{
    margin:0 0 22px;
    color: var(--ink-soft);
    font-size:14px;
  }
  .field-row{
    display:flex; gap:16px; flex-wrap:wrap;
    margin-bottom:18px;
  }
  .field{
    flex:1 1 220px;
    display:flex; flex-direction:column; gap:6px;
  }
  .field label{
    font-size:12.5px; font-weight:600; text-transform:uppercase;
    letter-spacing:.5px; color: var(--green-800);
  }
  select, input[type=text]{
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid var(--paper-line-strong);
    background: var(--paper);
    color: var(--ink);
    outline:none;
  }
  select:focus, input[type=text]:focus{
    border-color: var(--wood-dark);
    box-shadow: 0 0 0 3px rgba(200,147,79,.25);
  }
  .btn{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition: transform .08s ease, filter .12s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--green-800); color: var(--chalk); }
  .btn-primary:hover{ filter:brightness(1.12); }
  .btn-primary:disabled{ background:#B9B39A; color:#fff; cursor:not-allowed; }
  .btn-outline{
    background: transparent; color: var(--green-800);
    border:1.5px solid var(--green-800);
  }
  .btn-outline:hover{ background: rgba(30,59,41,.08); }
  .btn-danger{ background: var(--danger); color:#fff; }
  .btn-danger:hover{ filter:brightness(1.1); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:6px; }
  .btn-icon{
    width:30px; height:30px; padding:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-size:14px;
  }

  .manage-toggle{
    font-size:13px; color: var(--green-800); font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    margin-top:2px; user-select:none;
  }
  .manage-toggle .chev{ transition: transform .15s ease; display:inline-block; }
  .manage-toggle.open .chev{ transform: rotate(90deg); }
  .manage-panel{
    display:none;
    margin-top:14px;
    border-top:1px dashed var(--paper-line-strong);
    padding-top:14px;
  }
  .manage-panel.open{ display:block; }
  .turma-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px;
    border-radius:8px;
    background: var(--paper);
    margin-bottom:6px;
    font-size:14px;
  }
  .turma-row .actions{ display:flex; gap:6px; }
  .empty-note{
    font-size:13px; color: var(--ink-soft); font-style:italic;
    padding:10px 2px;
  }
  .admin-code-box{
    background: var(--gray-light);
    border:1.5px dashed var(--navy-dark);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:13.5px;
    color: var(--ink);
  }
  .admin-code-box code{
    background: var(--white);
    border:1px solid var(--paper-line-strong);
    border-radius:5px;
    padding:2px 8px;
    font-size:14px;
    font-weight:700;
    color: var(--navy-dark);
    letter-spacing:.5px;
  }
  .admin-code-box p{
    margin:6px 0 0;
    font-size:12px;
    color: var(--ink-soft);
    line-height:1.4;
  }

  /* ---------- ROOM VIEW ---------- */
  .room-wrap{ max-width: 1080px; margin: 0 auto; }
  .scroll-hint{
    display:none;
    font-size:12px; color: var(--ink-soft);
    text-align:center; margin:0 0 8px;
  }
  .canvas-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:4px;
  }
  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background: var(--white);
    border:1px solid var(--paper-line-strong);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:18px;
    box-shadow: var(--shadow);
  }
  .toolbar .title-block{ margin-right:auto; min-width:180px; }
  .toolbar h3{
    margin:0; font-family:'Zilla Slab', Georgia, serif; font-size:19px; color: var(--green-800);
  }
  .toolbar .meta{ font-size:12.5px; color: var(--ink-soft); margin-top:2px; }
  .toolbar .badge{
    display:inline-block; padding:2px 9px; border-radius:100px;
    font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:#fff; margin-right:6px;
  }
  .btn-home{ flex:none; }
  .editor-panel{
    display:none;
    flex-wrap:wrap;
    gap:16px 28px;
    align-items:center;
    background: var(--white);
    border:1px solid var(--paper-line-strong);
    border-radius:10px;
    padding:14px 16px;
    box-shadow: var(--shadow);
    margin-bottom:18px;
  }
  .editor-panel.open{ display:flex; }
  .editor-panel .editor-hint{
    flex-basis:100%;
    margin:2px 0 0;
    padding-top:10px;
    border-top:1px dashed var(--paper-line-strong);
    font-size:11.5px; color: var(--ink-soft); line-height:1.4;
  }
  .editor-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .editor-label{
    font-size:12.5px; font-weight:600; color: var(--green-800);
  }
  .editor-row .stepper{ display:flex; gap:3px; }
  .editor-row-tags{ flex-basis:100%; }
  .tag-buttons{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-tag{
    font-family:'Work Sans', sans-serif;
    font-size:12.5px; font-weight:700;
    padding:7px 12px;
    border-radius:8px;
    border:1.5px solid var(--paper-line-strong);
    background:#fff;
    cursor:pointer;
    transition: transform .08s ease, box-shadow .12s ease;
  }
  .btn-tag:active{ transform: translateY(1px); }
  .btn-tag-aee.active{
    background:#F6CF3E; border-color:#A6821B;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
  }
  .btn-tag-atrapalha.active{
    background:#E5544B; border-color:#8C2A22; color:#fff;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
  }
  .btn-tag-swap.active{
    background: var(--navy-dark); border-color: var(--navy-dark2); color:#fff;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
  }

  .room-canvas{
    position:relative;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/26px 26px,
      var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 26px;
    display:grid;
    grid-template-columns: 92px 1fr 92px;
    grid-template-rows: 56px 1fr 66px;
    grid-template-areas:
      "back   back   back"
      "left   desks  right"
      "front  front  front";
    gap: 10px;
    min-height: 560px;
  }
  .side-select{
    font-family:'Work Sans', sans-serif;
    font-size:12.5px;
    padding:3px 6px;
    border-radius:5px;
    border:1px solid var(--paper-line-strong);
    background:#fff;
    color: var(--ink);
  }
  .wall-back{
    grid-area: back;
    border-bottom: 3px solid var(--ink);
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:6px;
    font-size:17px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--ink-soft);
  }
  .wall-left{
    grid-area:left;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:16px; padding:10px 0;
    border-right: 3px solid var(--ink);
  }
  .wall-right{
    grid-area:right;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:16px; padding:10px 0;
    border-left: 3px solid var(--ink);
  }
  .door-group{
    margin-top:auto;
    display:flex; flex-direction:column; align-items:center;
  }
  .windows-block{
    display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
    flex:1; width:100%;
  }
  .door{
    width:20px; height:70px;
    background: var(--wood-dark);
    border:1.5px solid var(--ink);
    border-radius:2px;
    position:relative;
  }
  .door::after{
    content:""; position:absolute; right:3px; top:50%;
    width:3px; height:3px; border-radius:50%;
    background: var(--chalk-dim);
  }
  .window-pane{
    width:54px; height:96px;
    border:2.5px solid var(--ink);
    border-radius:2px;
    background: var(--navy-dark);
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr 1fr;
    gap:3px;
    padding:3px;
  }
  .window-pane span{
    background: repeating-linear-gradient(180deg, #DCE9EE 0 6px, #C4DCE6 6px 7px);
    border:1px solid rgba(0,0,0,.18);
  }
  .wall-front{
    grid-area: front;
    border-top: 3px solid var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding-top:8px;
  }
  .whiteboard{
    width:60%; min-width:220px; height:14px;
    background:#F7FAF9; border:2px solid var(--ink); border-radius:2px;
    position:relative;
  }
  .whiteboard::after{
    content:""; position:absolute; left:8%; right:8%; bottom:-4px; height:3px;
    background: var(--ink-soft); opacity:.4; border-radius:2px;
  }
  .teacher-desk{
    width:150px; height:64px;
    background: linear-gradient(180deg, var(--gray-light), var(--gray-light2));
    border:2px solid var(--navy-dark); border-radius:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color: var(--navy-dark); font-size:12.5px; font-weight:700; letter-spacing:.4px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.08);
    position:relative;
  }
  .teacher-desk .leaf{
    position:absolute; top:-8px; right:10px; width:10px; height:10px;
    background:#4E7A46; border-radius:50% 50% 50% 0; border:1px solid var(--ink);
  }

  .desks-grid{
    grid-area: desks;
    display:grid;
    gap: 14px 18px;
    align-content:start;
    justify-content:center;
  }
  .seat{
    width:88px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:default;
  }
  .edit-mode .seat{ cursor:pointer; }
  .seat-clear{
    position:absolute; top:-8px; right:-8px;
    width:20px; height:20px; padding:0;
    border-radius:50%;
    background: var(--danger); color:#fff;
    border:1.5px solid #fff;
    font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    z-index:5;
    transition: opacity .15s ease, transform .1s ease;
  }
  .edit-mode .seat-clear{ opacity:1; pointer-events:auto; }
  .seat-clear:hover{ filter:brightness(1.1); transform: scale(1.1); }
  .seat-clear:active{ transform: scale(.94); }

  .seat-removed{ width:88px; display:flex; align-items:center; justify-content:center; }
  .empty-slot{
    width:100%; height:66px;
    border:2px dashed var(--paper-line-strong);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .15s ease;
  }
  .edit-mode .empty-slot{ opacity:1; pointer-events:auto; }
  .restore-btn{
    width:28px; height:28px; border-radius:50%;
    border:1.5px dashed var(--green-700);
    background:#fff; color: var(--green-700);
    font-size:16px; font-weight:700; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .12s ease, color .12s ease, transform .1s ease;
  }
  .restore-btn:hover{ background: var(--green-800); color: var(--chalk); }
  .restore-btn:active{ transform: scale(.92); }
  .chair{
    width:34px; height:12px;
    background: var(--navy-dark);
    border-radius:3px 3px 1px 1px;
    opacity:.9;
  }
  .desk{
    width:100%; height:52px;
    background: linear-gradient(180deg, var(--gray-light), var(--gray-light2));
    border:2px solid var(--navy-dark);
    border-radius:5px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.06), 0 2px 3px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
    padding:4px 6px;
    position:relative;
    transition: outline .12s ease, transform .1s ease;
  }
  .seat:hover .desk{ transform: translateY(-1px); }
  .desk .name{
    font-family: Arial, Helvetica, sans-serif;
    font-size:13.5px;
    font-weight:700;
    color: var(--navy-dark);
    text-align:center;
    line-height:1.15;
    width:100%;
    max-height:42px;
    overflow:hidden;
    white-space:normal;
    word-break:break-word;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .desk .name.empty{
    color:#6B7686; font-family: Arial, Helvetica, sans-serif; font-size:10.5px;
    font-weight:600; letter-spacing:.4px; text-transform:uppercase; opacity:.7;
    white-space:nowrap;
  }
  .desk.editing{ padding:0; }
  .desk input{
    width:100%; height:100%;
    border:none; background:transparent; text-align:center;
    font-family: Arial, Helvetica, sans-serif; font-size:13.5px; font-weight:700; color: var(--navy-dark);
    outline:none;
  }
  .desk.filled{ outline: 2px solid transparent; }
  .desk.match{
    outline: 3px solid var(--navy-dark);
    box-shadow: 0 0 0 5px rgba(232,196,104,.55);
  }
  .desk.tag-aee{
    background: linear-gradient(180deg, #FCE380, #F6CF3E);
    border-color: #A6821B;
  }
  .desk.tag-atrapalha{
    background: linear-gradient(180deg, #F0897E, #E5544B);
    border-color: #8C2A22;
  }
  .desk.tag-atrapalha .name{ color:#fff; }
  .desk.tag-atrapalha .name.empty{ color: rgba(255,255,255,.85); }
  .desk.swap-selected{
    outline: 3px dashed var(--navy-dark);
    box-shadow: 0 0 0 5px rgba(58,90,135,.35);
    animation: swap-pulse 1s ease-in-out infinite;
  }
  @keyframes swap-pulse{
    0%, 100% { box-shadow: 0 0 0 5px rgba(58,90,135,.35); }
    50% { box-shadow: 0 0 0 9px rgba(58,90,135,.15); }
  }
  .room-canvas.tag-picking .seat{ cursor: crosshair; }
  .seat .idx{
    font-size:9px; color: var(--ink-soft); opacity:.7; letter-spacing:.5px;
  }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; top:16px; right:16px;
    background: var(--green-800); color: var(--chalk);
    padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600;
    box-shadow: var(--shadow);
    opacity:0; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index:999;
  }
  #toast.show{ opacity:1; transform: translateY(0); }

  footer.foot{
    text-align:center; color:#8FA090; font-size:11.5px;
    padding: 16px 10px 26px;
  }

  @media print{
    header.app-header, nav.tabbar, .toolbar, .scroll-hint, footer.foot, #toast{ display:none !important; }
    body, main{ background:#fff; padding:0; }
    .canvas-scroll{ overflow:visible !important; }
    .room-canvas{ box-shadow:none; }
  }

  /* ---------- RESPONSIVO (CELULAR) ---------- */
  @media (max-width: 720px){
    header.app-header{ padding: calc(14px + env(safe-area-inset-top)) 16px 12px; }
    .header-row{ flex-wrap:wrap; row-gap:10px; }
    .btn-install{ padding:8px 12px; font-size:12.5px; }
    .school-sub{ font-size:11px; }

    nav.tabbar{ padding: 8px 12px 0; }
    .tab{ padding:8px 11px; font-size:12.5px; }

    main{ padding: 14px; min-height: calc(100vh - 120px); }

    .panel{ padding:20px 16px; border-radius:12px; }
    .panel h2{ font-size:19px; }
    .field-row{ gap:12px; }
    .btn-primary#btn-abrir{ width:100%; padding:12px 18px; }

    .toolbar{ padding:10px 12px; gap:8px; }
    .btn-home{ order:-2; }
    .toolbar .title-block{ min-width:100%; order:-1; }
    .toolbar h3{ font-size:17px; }
    #busca{ flex:1 1 100%; max-width:none; order:1; }
    #btn-editar{ order:2; }
    #btn-print{ order:3; }
    .btn{ min-height:38px; }
    .btn-icon{ width:34px; height:34px; }
    .editor-panel{ gap:12px 18px; padding:12px 14px; }
    .editor-row{ flex:1 1 45%; }

    .scroll-hint{ display:block; }
    .room-canvas{
      grid-template-columns: 60px 1fr 60px;
      grid-template-rows: 44px 1fr 58px;
      padding:14px;
      min-height:auto;
    }
    .wall-back{ font-size:13.5px; letter-spacing:1px; }
    .window-pane{ width:38px; height:70px; }
    .door{ width:16px; height:54px; }
    .teacher-desk{ width:120px; height:52px; font-size:11px; }
    .whiteboard{ min-width:160px; }
    .seat-clear, .restore-btn{ width:24px; height:24px; font-size:13px; }
  }

  @media (max-width: 400px){
    .school-name{ font-size:17px; }
    .panel{ padding:16px 12px; }
    .toolbar h3{ font-size:15.5px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div>
      <h1 class="school-name">E.E.E.F.M. Ilda Ferreira da Fonseca Martins</h1>
      <div class="school-sub">Mapa de sala — organização de assentos por turno e turma</div>
    </div>
    <button class="btn btn-install" id="btn-install" hidden>⬇ Instalar app</button>
  </div>
</header>

<nav class="tabbar" id="tabbar"></nav>

<main id="main"></main>

<div id="toast"></div>

<footer class="foot">Os dados ficam salvos automaticamente no seu navegador.</footer>

<script>
(function(){
  "use strict";

  /* ============ CONFIG ============ */
  var TURNOS = [
    { id:'integral', label:'Turno Integral', color:'#3E7B4F' },
    { id:'parcial',  label:'Turno Parcial',  color:'#2E6C9E' },
    { id:'noturno',  label:'Turno Noturno',  color:'#6B4C9E' }
  ];
  var DEFAULT_TURMAS = {
    integral: ['6º Ano A', '6º Ano B', '7º Ano A', '7º Ano B', '8º Ano A', '9º Ano A'],
    parcial:  ['1ª Série A', '1ª Série B', '2ª Série A', '3ª Série A'],
    noturno:  ['1ª Série A - Noturno', '2ª Série A - Noturno', '3ª Série A - Noturno']
  };
  var DEFAULT_ROWS = 8;
  var DEFAULT_COLS = 5;
  var MIN_ROWS = 1, MAX_ROWS = 12, MIN_COLS = 1, MAX_COLS = 8;
  var DEFAULT_DOOR_SIDE = 'left';
  var DEFAULT_WINDOW_SIDE = 'right';
  // Senha para liberar a gestão de turmas (criar/renomear/excluir).
  // Para trocar a senha, edite o valor abaixo e salve o arquivo.
  var ADMIN_PASSWORD = 'ilda2026';
  var adminUnlocked = false;
  // Código para liberar o botão "Editar sala" (linhas, colunas, porta, janela e excluir mesas).
  // Fica visível dentro de "Gerenciar turmas do turno selecionado", para o administrador repassar
  // a quem precisar mexer no mapa da sala sem dar acesso total de administrador.
  var EDIT_ROOM_CODE = 'sala2026';
  var editRoomUnlocked = false;

  /* ============ STATE ============ */
  var turmasByTurno = { integral: null, parcial: null, noturno: null };
  var tabs = [];            // {id, turno, turma}
  var activeTabId = 'home';
  var layoutCache = {};     // key -> {rows, cols, seats:{}, removed:{}, doorSide, windowSide}
  var roomUiState = {};     // tabId -> { editOpen: bool }
  var saveTimers = {};

  function turnoInfo(id){
    for (var i=0;i<TURNOS.length;i++) if (TURNOS[i].id===id) return TURNOS[i];
    return TURNOS[0];
  }

  /* ============ BANCO DE DADOS COMPARTILHADO (opcional) ============ */
  // Preencha os campos abaixo com as informações do SEU projeto Firebase para que
  // TODOS os computadores/celulares que abrirem este app vejam o mesmo mapa de sala.
  // Passo a passo: https://console.firebase.google.com → criar projeto → Realtime Database
  // → criar banco → copiar as informações de configuração do app aqui embaixo.
  // Se deixar como está (sem preencher), o app continua funcionando normalmente,
  // só que salvando os dados apenas neste navegador (como já fazia antes).
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDBekKuPiwHTURiQcmAYdWb9fkbmKpx4lQ",
    authDomain: "mapa-de-sala-1da4c.firebaseapp.com",
    databaseURL: "https://mapa-de-sala-1da4c-default-rtdb.firebaseio.com",
    projectId: "mapa-de-sala-1da4c",
    storageBucket: "mapa-de-sala-1da4c.firebasestorage.app",
    messagingSenderId: "627169156398",
    appId: "1:627169156398:web:3b10e71cf952c44cb6aebf"
  };
  function isFirebaseConfigured(){
    return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('COLE_AQUI') === -1 &&
      FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.indexOf('SEU-PROJETO') === -1;
  }
  function makeFirebaseStore(){
    try{
      if (typeof firebase === 'undefined') return null;
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      var db = firebase.database();
      var root = 'mapaDeSalaIldaFerreira/';

      // Login anônimo: necessário se as regras do banco exigirem "auth != null".
      // Não pede nada ao usuário — acontece sozinho, em segundo plano.
      var authReady;
      if (firebase.auth){
        authReady = new Promise(function(resolve){
          var done = false;
          firebase.auth().onAuthStateChanged(function(user){
            if (user && !done){ done = true; resolve(user); }
          });
          firebase.auth().signInAnonymously().catch(function(err){
            console.warn('Login anônimo do Firebase falhou:', err);
            if (!done){ done = true; resolve(null); }
          });
        });
      } else {
        authReady = Promise.resolve(null);
      }

      return {
        get: function(key){
          return authReady.then(function(){
            return db.ref(root+key).once('value').then(function(snap){
              var v = snap.val();
              return (v===null || v===undefined) ? null : { key:key, value:v, shared:true };
            });
          });
        },
        set: function(key, value){
          return authReady.then(function(){
            return db.ref(root+key).set(value).then(function(){
              return { key:key, value:value, shared:true };
            });
          });
        },
        delete: function(key){
          return authReady.then(function(){
            return db.ref(root+key).remove().then(function(){
              return { key:key, deleted:true, shared:true };
            });
          });
        }
      };
    } catch(e){ console.warn('Firebase indisponível:', e); return null; }
  }

  /* ============ STORAGE LAYER (com fallback) ============ */
  // Prioridade: 1) Firebase (se configurado acima, compartilhado entre todos)
  //             2) window.storage (Claude.ai)  3) localStorage do navegador  4) memória
  var STORAGE_MODE = 'cloud';

  function makeMemoryStore(){
    var mem = {};
    return {
      get: function(key){ return Promise.resolve(Object.prototype.hasOwnProperty.call(mem,key) ? { key:key, value: mem[key], shared:false } : null); },
      set: function(key, value){ mem[key] = value; return Promise.resolve({ key:key, value:value, shared:false }); },
      delete: function(key){ delete mem[key]; return Promise.resolve({ key:key, deleted:true, shared:false }); }
    };
  }

  function makeLocalStorageStore(){
    var ns = 'mapa-sala-ildaferreira::';
    try {
      localStorage.setItem('__test__','1');
      localStorage.removeItem('__test__');
    } catch(e){ return null; }
    return {
      get: function(key){
        try {
          var v = localStorage.getItem(ns+key);
          return Promise.resolve(v===null ? null : { key:key, value:v, shared:false });
        } catch(e){ return Promise.reject(e); }
      },
      set: function(key, value){
        try {
          localStorage.setItem(ns+key, value);
          return Promise.resolve({ key:key, value:value, shared:false });
        } catch(e){ return Promise.reject(e); }
      },
      delete: function(key){
        try {
          localStorage.removeItem(ns+key);
          return Promise.resolve({ key:key, deleted:true, shared:false });
        } catch(e){ return Promise.reject(e); }
      }
    };
  }

  var STORE;
  var STORE_VERIFIED = false;
  if (isFirebaseConfigured()){
    var fbStore = makeFirebaseStore();
    if (fbStore){ STORE = fbStore; STORAGE_MODE = 'firebase'; }
  }
  if (!STORE){
    if (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
      STORE = window.storage;
      STORAGE_MODE = 'cloud';
    } else {
      var ls = makeLocalStorageStore();
      if (ls){ STORE = ls; STORAGE_MODE = 'local'; }
      else { STORE = makeMemoryStore(); STORAGE_MODE = 'memory'; }
      STORE_VERIFIED = true;
    }
  }

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){
        if (!done){ done = true; reject(new Error('timeout')); }
      }, ms);
      Promise.resolve(promise).then(function(v){
        if (!done){ done = true; clearTimeout(timer); resolve(v); }
      }, function(e){
        if (!done){ done = true; clearTimeout(timer); reject(e); }
      });
    });
  }

  // Se o STORE escolhido (Firebase ou window.storage) não responder a tempo — sem
  // internet, config errada, regras do banco bloqueando, extensão sem sessão ativa —
  // trocamos automaticamente para o armazenamento local, para o app nunca travar.
  function downgradeStore(){
    if (STORE_VERIFIED) return;
    STORE_VERIFIED = true;
    var wasFirebase = (STORAGE_MODE === 'firebase');
    var ls = makeLocalStorageStore();
    STORE = ls || makeMemoryStore();
    STORAGE_MODE = ls ? 'local' : 'memory';
    showToast(wasFirebase
      ? 'Não foi possível conectar ao banco compartilhado — usando armazenamento local deste navegador.'
      : 'Usando armazenamento local deste navegador.');
    homeState.turno = '';
    homeState.turma = '';
    renderMain();
  }
  function ensureStoreVerified(){
    if (STORE_VERIFIED || (STORAGE_MODE !== 'cloud' && STORAGE_MODE !== 'firebase')) return Promise.resolve();
    return withTimeout(STORE.get('__ping__'), 4000).then(function(){
      STORE_VERIFIED = true;
      if (STORAGE_MODE === 'firebase') showToast('Conectado ao banco de dados compartilhado ✓');
    }).catch(function(){
      downgradeStore();
    });
  }

  /* ============ STORAGE HELPERS ============ */
  function slugify(str){
    return str
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/(^-+|-+$)/g,'') || 'x';
  }
  function turmasKey(turno){ return 'turmas-' + turno; }
  function layoutKey(turno, turma){ return 'layout-' + turno + '-' + slugify(turma); }

  function storageGetSafe(key){
    return withTimeout(STORE.get(key), 4000).then(function(res){
      STORE_VERIFIED = true;
      return res ? res.value : null;
    }).catch(function(err){
      if ((STORAGE_MODE === 'cloud' || STORAGE_MODE === 'firebase') && !STORE_VERIFIED) downgradeStore();
      return null;
    });
  }
  function storageSetSafe(key, valueObj){
    return withTimeout(STORE.set(key, JSON.stringify(valueObj)), 4000).then(function(res){
      STORE_VERIFIED = true;
      return res;
    }).catch(function(err){
      console.error('Erro ao salvar', key, err);
      if ((STORAGE_MODE === 'cloud' || STORAGE_MODE === 'firebase') && !STORE_VERIFIED) downgradeStore();
      return null;
    });
  }
  function storageDeleteSafe(key){
    return withTimeout(STORE.delete(key), 4000).then(function(res){
      STORE_VERIFIED = true;
      return res;
    }).catch(function(){ return null; });
  }

  function loadTurmas(turno){
    if (turmasByTurno[turno]) return Promise.resolve(turmasByTurno[turno]);
    return storageGetSafe(turmasKey(turno)).then(function(raw){
      var list;
      if (raw){
        try { list = JSON.parse(raw); } catch(e){ list = null; }
      }
      if (!list || !Array.isArray(list)){
        list = DEFAULT_TURMAS[turno].slice();
        storageSetSafe(turmasKey(turno), list);
      }
      turmasByTurno[turno] = list;
      return list;
    });
  }
  function saveTurmas(turno, list){
    turmasByTurno[turno] = list;
    return storageSetSafe(turmasKey(turno), list);
  }

  function loadLayout(turno, turma){
    var key = layoutKey(turno, turma);
    if (layoutCache[key]) return Promise.resolve(layoutCache[key]);
    return storageGetSafe(key).then(function(raw){
      var layout;
      if (raw){
        try { layout = JSON.parse(raw); } catch(e){ layout = null; }
      }
      if (!layout || typeof layout !== 'object'){
        layout = { rows: DEFAULT_ROWS, cols: DEFAULT_COLS, seats: {}, tags: {}, doorSide: DEFAULT_DOOR_SIDE, windowSide: DEFAULT_WINDOW_SIDE };
      }
      if (!layout.seats) layout.seats = {};
      if (!layout.removed) layout.removed = {};
      if (!layout.tags) layout.tags = {};
      if (layout.doorSide !== 'left' && layout.doorSide !== 'right') layout.doorSide = DEFAULT_DOOR_SIDE;
      if (layout.windowSide !== 'left' && layout.windowSide !== 'right') layout.windowSide = DEFAULT_WINDOW_SIDE;
      layoutCache[key] = layout;
      return layout;
    });
  }
  function saveLayoutDebounced(turno, turma){
    var key = layoutKey(turno, turma);
    clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(function(){
      storageSetSafe(key, layoutCache[key]).then(function(){ showToast('Salvo'); });
    }, 450);
  }
  function deleteLayout(turno, turma){
    var key = layoutKey(turno, turma);
    delete layoutCache[key];
    return storageDeleteSafe(key);
  }
  function renameLayout(turno, oldTurma, newTurma){
    var oldKey = layoutKey(turno, oldTurma);
    var newKey = layoutKey(turno, newTurma);
    return storageGetSafe(oldKey).then(function(raw){
      if (raw){
        return withTimeout(STORE.set(newKey, raw), 4000).then(function(){
          layoutCache[newKey] = layoutCache[oldKey];
          delete layoutCache[oldKey];
          return storageDeleteSafe(oldKey);
        });
      }
    }).catch(function(){});
  }

  /* ============ TOAST ============ */
  var toastTimer;
  function showToast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1400);
  }

  /* ============ TABS ============ */
  function tabIdFor(turno, turma){ return turno + '::' + turma; }
  function findTab(id){
    for (var i=0;i<tabs.length;i++) if (tabs[i].id===id) return tabs[i];
    return null;
  }
  function openRoomTab(turno, turma){
    var id = tabIdFor(turno, turma);
    if (!findTab(id)) tabs.push({ id: id, turno: turno, turma: turma });
    activeTabId = id;
    renderTabs();
    renderMain();
  }
  function closeTab(id, evt){
    if (evt) evt.stopPropagation();
    tabs = tabs.filter(function(t){ return t.id !== id; });
    delete roomUiState[id];
    if (activeTabId === id){
      activeTabId = tabs.length ? tabs[tabs.length-1].id : 'home';
    }
    renderTabs();
    renderMain();
  }
  function switchTab(id){
    activeTabId = id;
    renderTabs();
    renderMain();
  }

  function renderTabs(){
    var bar = document.getElementById('tabbar');
    bar.innerHTML = '';

    var home = document.createElement('div');
    home.className = 'tab home' + (activeTabId==='home' ? ' active' : '');
    home.innerHTML = '<span>Selecionar</span>';
    home.onclick = function(){ switchTab('home'); };
    bar.appendChild(home);

    tabs.forEach(function(t){
      var info = turnoInfo(t.turno);
      var el = document.createElement('div');
      el.className = 'tab' + (activeTabId===t.id ? ' active' : '');
      el.innerHTML =
        '<span class="dot" style="background:'+info.color+'"></span>' +
        '<span>'+escapeHtml(t.turma)+'</span>' +
        '<span class="close" title="Fechar aba">✕</span>';
      el.onclick = function(){ switchTab(t.id); };
      el.querySelector('.close').onclick = function(e){ closeTab(t.id, e); };
      bar.appendChild(el);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ============ RENDER: HOME / SELECT PANEL ============ */
  var homeState = { turno: '', turma: '', manageOpen: false };

  function renderMain(){
    var main = document.getElementById('main');
    main.innerHTML = '';
    if (activeTabId === 'home'){
      renderHome(main);
    } else {
      var tab = findTab(activeTabId);
      if (!tab){ switchTab('home'); return; }
      renderRoom(main, tab);
    }
  }

  function renderHome(main){
    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML =
      '<h2>Selecionar turno e turma</h2>' +
      '<p class="hint">Escolha o turno e a turma para abrir o mapa de sala correspondente em uma nova aba.</p>' +
      '<div class="field-row">' +
        '<div class="field">' +
          '<label for="sel-turno">Turno</label>' +
          '<select id="sel-turno"><option value="">Selecione o turno…</option>' +
            TURNOS.map(function(t){ return '<option value="'+t.id+'">'+t.label+'</option>'; }).join('') +
          '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label for="sel-turma">Turma / Sala</label>' +
          '<select id="sel-turma" disabled><option value="">Selecione o turno primeiro</option></select>' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-primary" id="btn-abrir" disabled>Abrir mapa da sala</button>' +
      '<div style="margin-top:22px;">' +
        '<span class="manage-toggle" id="manage-toggle"><span class="chev">▶</span> Gerenciar turmas do turno selecionado</span>' +
        '<div class="manage-panel" id="manage-panel"></div>' +
      '</div>';
    main.appendChild(panel);

    var selTurno = panel.querySelector('#sel-turno');
    var selTurma = panel.querySelector('#sel-turma');
    var btnAbrir = panel.querySelector('#btn-abrir');
    var manageToggle = panel.querySelector('#manage-toggle');
    var managePanel = panel.querySelector('#manage-panel');

    selTurno.value = homeState.turno;
    manageToggle.classList.toggle('open', homeState.manageOpen);
    managePanel.classList.toggle('open', homeState.manageOpen);

    selTurno.addEventListener('change', function(){
      homeState.turno = selTurno.value;
      homeState.turma = '';
      btnAbrir.disabled = true;
      if (!homeState.turno){
        selTurma.disabled = true;
        selTurma.innerHTML = '<option value="">Selecione o turno primeiro</option>';
        renderManagePanel(managePanel, null);
        return;
      }
      selTurma.disabled = false;
      selTurma.innerHTML = '<option value="">Carregando…</option>';
      loadTurmas(homeState.turno).then(function(list){
        fillTurmaSelect(selTurma, list);
        renderManagePanel(managePanel, homeState.turno);
      });
    });

    selTurma.addEventListener('change', function(){
      homeState.turma = selTurma.value;
      btnAbrir.disabled = !homeState.turma;
    });

    btnAbrir.addEventListener('click', function(){
      if (homeState.turno && homeState.turma) openRoomTab(homeState.turno, homeState.turma);
    });

    manageToggle.addEventListener('click', function(){
      if (!homeState.manageOpen){
        if (!adminUnlocked){
          var pass = prompt('Área restrita.\nDigite a senha de administrador para gerenciar as turmas:');
          if (pass === null) return;
          if (pass !== ADMIN_PASSWORD){
            alert('Senha incorreta.');
            return;
          }
          adminUnlocked = true;
        }
      }
      homeState.manageOpen = !homeState.manageOpen;
      manageToggle.classList.toggle('open', homeState.manageOpen);
      managePanel.classList.toggle('open', homeState.manageOpen);
      if (homeState.manageOpen && homeState.turno){
        renderManagePanel(managePanel, homeState.turno);
      }
    });

    // Restore previous selections if any
    if (homeState.turno){
      selTurma.disabled = false;
      selTurma.innerHTML = '<option value="">Carregando…</option>';
      loadTurmas(homeState.turno).then(function(list){
        fillTurmaSelect(selTurma, list);
        selTurma.value = homeState.turma || '';
        btnAbrir.disabled = !homeState.turma;
        if (homeState.manageOpen) renderManagePanel(managePanel, homeState.turno);
      });
    }
  }

  function fillTurmaSelect(selectEl, list){
    var opts = '<option value="">Selecione a turma…</option>';
    list.forEach(function(name){
      opts += '<option value="'+escapeHtml(name)+'">'+escapeHtml(name)+'</option>';
    });
    selectEl.innerHTML = opts;
  }

  function renderManagePanel(container, turno){
    if (!turno){
      container.innerHTML = '<p class="empty-note">Selecione um turno para gerenciar suas turmas.</p>';
      return;
    }
    container.innerHTML = '<p class="empty-note">Carregando turmas…</p>';
    loadTurmas(turno).then(function(list){
      var html = '';
      html +=
        '<div class="admin-code-box">' +
          '<strong>Código para editar o mapa da sala:</strong> <code>'+escapeHtml(EDIT_ROOM_CODE)+'</code>' +
          '<p>Repasse este código para quem precisar mexer em linhas, colunas, porta, janelas ou excluir mesas ao abrir uma sala — sem precisar da senha de administrador.</p>' +
        '</div>';
      if (!list.length){
        html += '<p class="empty-note">Nenhuma turma cadastrada neste turno ainda.</p>';
      } else {
        list.forEach(function(name){
          html +=
            '<div class="turma-row">' +
              '<span>'+escapeHtml(name)+'</span>' +
              '<span class="actions">' +
                '<button class="btn btn-outline btn-sm" data-act="rename" data-name="'+escapeHtml(name)+'">Renomear</button>' +
                '<button class="btn btn-danger btn-sm" data-act="delete" data-name="'+escapeHtml(name)+'">Excluir</button>' +
              '</span>' +
            '</div>';
        });
      }
      html += '<button class="btn btn-outline btn-sm" id="btn-add-turma" style="margin-top:8px;">+ Nova turma</button>';
      container.innerHTML = html;

      container.querySelectorAll('[data-act="rename"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var oldName = btn.getAttribute('data-name');
          var novo = prompt('Novo nome para a turma:', oldName);
          if (!novo) return;
          novo = novo.trim();
          if (!novo || novo === oldName) return;
          loadTurmas(turno).then(function(list2){
            if (list2.indexOf(novo) !== -1){ alert('Já existe uma turma com esse nome.'); return; }
            var idx = list2.indexOf(oldName);
            if (idx === -1) return;
            list2[idx] = novo;
            saveTurmas(turno, list2);
            renameLayout(turno, oldName, novo);
            // Update any open tab referencing the old name
            tabs.forEach(function(t){
              if (t.turno===turno && t.turma===oldName){ t.turma = novo; t.id = tabIdFor(turno, novo); }
            });
            homeState.turma = (homeState.turma===oldName) ? novo : homeState.turma;
            renderTabs();
            renderMain();
          });
        });
      });
      container.querySelectorAll('[data-act="delete"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var name = btn.getAttribute('data-name');
          if (!confirm('Excluir a turma "'+name+'" e todo o mapa de sala salvo dela?')) return;
          loadTurmas(turno).then(function(list2){
            list2 = list2.filter(function(n){ return n !== name; });
            saveTurmas(turno, list2);
            deleteLayout(turno, name);
            var closingId = tabIdFor(turno, name);
            if (findTab(closingId)) closeTab(closingId);
            if (homeState.turma === name) homeState.turma = '';
            renderMain();
          });
        });
      });
      var addBtn = container.querySelector('#btn-add-turma');
      if (addBtn) addBtn.addEventListener('click', function(){
        var nome = prompt('Nome da nova turma (ex: 7º Ano C):');
        if (!nome) return;
        nome = nome.trim();
        if (!nome) return;
        loadTurmas(turno).then(function(list2){
          if (list2.indexOf(nome) !== -1){ alert('Essa turma já existe.'); return; }
          list2.push(nome);
          saveTurmas(turno, list2);
          renderMain();
        });
      });
    });
  }

  /* ============ RENDER: ROOM VIEW ============ */
  function renderRoom(main, tab){
    var wrap = document.createElement('div');
    wrap.className = 'room-wrap';
    wrap.innerHTML = '<p class="empty-note">Carregando mapa da sala…</p>';
    main.appendChild(wrap);

    loadLayout(tab.turno, tab.turma).then(function(layout){
      var info = turnoInfo(tab.turno);
      var totalSlots = layout.rows * layout.cols;
      var removedCount = Object.keys(layout.removed).filter(function(k){
        var parts = k.split('_'); var rr = +parts[0], cc = +parts[1];
        return rr < layout.rows && cc < layout.cols && layout.removed[k];
      }).length;
      var total = totalSlots - removedCount;
      var filled = Object.keys(layout.seats).filter(function(k){
        return (layout.seats[k]||'').trim() && !layout.removed[k];
      }).length;
      var uiState = roomUiState[tab.id] || (roomUiState[tab.id] = { editOpen: false, tagMode: null });
      if (typeof uiState.tagMode === 'undefined') uiState.tagMode = null;
      if (typeof uiState.swapFirstKey === 'undefined') uiState.swapFirstKey = null;

      wrap.innerHTML =
        '<div class="toolbar">' +
          '<button class="btn btn-outline btn-sm btn-home" id="btn-home" title="Voltar para Selecionar">Página inicial</button>' +
          '<div class="title-block">' +
            '<h3>'+escapeHtml(tab.turma)+'</h3>' +
            '<div class="meta"><span class="badge" style="background:'+info.color+'">'+info.label+'</span>' +
              filled + ' de ' + total + ' assentos preenchidos</div>' +
          '</div>' +
          '<input type="text" id="busca" placeholder="Buscar aluno…" style="max-width:180px;">' +
          '<button class="btn btn-outline btn-sm" id="btn-editar">✎ Editar sala</button>' +
          '<button class="btn btn-outline btn-sm" id="btn-print">🖨 Imprimir</button>' +
        '</div>' +
        '<div class="editor-panel'+(uiState.editOpen?' open':'')+'" id="editor-panel">' +
          '<div class="editor-row">' +
            '<span class="editor-label">Linhas</span>' +
            '<span class="stepper">' +
              '<button class="btn btn-outline btn-icon" data-adj="rows" data-d="-1">–</button>' +
              '<button class="btn btn-outline btn-icon" data-adj="rows" data-d="1">+</button>' +
            '</span>' +
          '</div>' +
          '<div class="editor-row">' +
            '<span class="editor-label">Colunas</span>' +
            '<span class="stepper">' +
              '<button class="btn btn-outline btn-icon" data-adj="cols" data-d="-1">–</button>' +
              '<button class="btn btn-outline btn-icon" data-adj="cols" data-d="1">+</button>' +
            '</span>' +
          '</div>' +
          '<div class="editor-row">' +
            '<span class="editor-label">Porta</span>' +
            '<select id="sel-porta" class="side-select">' +
              '<option value="left"'+(layout.doorSide==='left'?' selected':'')+'>Esquerda</option>' +
              '<option value="right"'+(layout.doorSide==='right'?' selected':'')+'>Direita</option>' +
            '</select>' +
          '</div>' +
          '<div class="editor-row">' +
            '<span class="editor-label">Janela</span>' +
            '<select id="sel-janela" class="side-select">' +
              '<option value="left"'+(layout.windowSide==='left'?' selected':'')+'>Esquerda</option>' +
              '<option value="right"'+(layout.windowSide==='right'?' selected':'')+'>Direita</option>' +
            '</select>' +
          '</div>' +
          '<div class="editor-row editor-row-tags">' +
            '<span class="editor-label">Marcar aluno</span>' +
            '<span class="tag-buttons">' +
              '<button type="button" class="btn-tag btn-tag-aee'+(uiState.tagMode==='aee'?' active':'')+'" id="btn-tag-aee">🟡 Aluno AEE</button>' +
              '<button type="button" class="btn-tag btn-tag-atrapalha'+(uiState.tagMode==='atrapalha'?' active':'')+'" id="btn-tag-atrapalha">🔴 Ponto de Atenção</button>' +
              '<button type="button" class="btn-tag btn-tag-swap'+(uiState.tagMode==='swap'?' active':'')+'" id="btn-tag-swap">🔁 Trocar lugar</button>' +
            '</span>' +
          '</div>' +
          '<p class="editor-hint">Com a sala em edição, você pode editar nomes, excluir ou recolocar mesas individuais no mapa. Para marcar um aluno, clique em "Aluno AEE" ou "Ponto de Atenção" e depois na mesa dele — clique de novo na mesma mesa para remover a marcação. Para trocar dois alunos de lugar, clique em "Trocar lugar" e depois nas duas mesas que vão trocar.</p>' +
        '</div>' +
        '<p class="scroll-hint">↔ Arraste para o lado para ver a sala inteira</p>' +
        '<div class="canvas-scroll">' +
          '<div class="room-canvas'+(uiState.editOpen?' edit-mode':'')+(uiState.tagMode?' tag-picking':'')+'" id="room-canvas">' +
            '<div class="wall-back">Fundo da sala</div>' +
            '<div class="wall-left" id="wall-left"></div>' +
            '<div class="desks-grid" id="desks-grid"></div>' +
            '<div class="wall-right" id="wall-right"></div>' +
            '<div class="wall-front">' +
              '<div class="teacher-desk"><span class="leaf"></span>MESA DO PROFESSOR</div>' +
              '<div class="whiteboard" title="Quadro branco"></div>' +
            '</div>' +
          '</div>' +
        '</div>';

      renderWalls(wrap, layout);
      buildDesksGrid(wrap, tab, layout);

      wrap.querySelector('#btn-home').addEventListener('click', function(){
        switchTab('home');
      });

      var btnEditar = wrap.querySelector('#btn-editar');
      var editorPanel = wrap.querySelector('#editor-panel');
      var roomCanvas = wrap.querySelector('#room-canvas');
      btnEditar.addEventListener('click', function(e){
        e.stopPropagation();
        if (!editorPanel.classList.contains('open')){
          if (!adminUnlocked && !editRoomUnlocked){
            var code = prompt('Área restrita.\nDigite o código para editar o mapa da sala:');
            if (code === null) return;
            if (code !== EDIT_ROOM_CODE){
              alert('Código incorreto.');
              return;
            }
            editRoomUnlocked = true;
          }
        }
        var isOpen = editorPanel.classList.toggle('open');
        roomCanvas.classList.toggle('edit-mode', isOpen);
        uiState.editOpen = isOpen;
        if (!isOpen){
          uiState.tagMode = null;
          roomCanvas.classList.remove('tag-picking');
        }
      });
      editorPanel.addEventListener('click', function(e){ e.stopPropagation(); });

      var btnTagAee = wrap.querySelector('#btn-tag-aee');
      var btnTagAtrapalha = wrap.querySelector('#btn-tag-atrapalha');
      var btnTagSwap = wrap.querySelector('#btn-tag-swap');
      function setTagMode(mode){
        uiState.tagMode = (uiState.tagMode === mode) ? null : mode;
        uiState.swapFirstKey = null;
        wrap.querySelectorAll('.desk.swap-selected').forEach(function(d){ d.classList.remove('swap-selected'); });
        btnTagAee.classList.toggle('active', uiState.tagMode === 'aee');
        btnTagAtrapalha.classList.toggle('active', uiState.tagMode === 'atrapalha');
        btnTagSwap.classList.toggle('active', uiState.tagMode === 'swap');
        roomCanvas.classList.toggle('tag-picking', !!uiState.tagMode);
      }
      btnTagAee.addEventListener('click', function(e){ e.stopPropagation(); setTagMode('aee'); });
      btnTagAtrapalha.addEventListener('click', function(e){ e.stopPropagation(); setTagMode('atrapalha'); });
      btnTagSwap.addEventListener('click', function(e){ e.stopPropagation(); setTagMode('swap'); });

      wrap.querySelector('#btn-print').addEventListener('click', function(){ window.print(); });
      wrap.querySelectorAll('[data-adj]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var kind = btn.getAttribute('data-adj');
          var d = parseInt(btn.getAttribute('data-d'), 10);
          if (kind === 'rows'){
            layout.rows = Math.max(MIN_ROWS, Math.min(MAX_ROWS, layout.rows + d));
          } else {
            layout.cols = Math.max(MIN_COLS, Math.min(MAX_COLS, layout.cols + d));
          }
          saveLayoutDebounced(tab.turno, tab.turma);
          main.innerHTML = '';
          renderRoom(main, tab);
        });
      });
      wrap.querySelector('#sel-porta').addEventListener('change', function(e){
        layout.doorSide = e.target.value;
        saveLayoutDebounced(tab.turno, tab.turma);
        renderWalls(wrap, layout);
      });
      wrap.querySelector('#sel-janela').addEventListener('change', function(e){
        layout.windowSide = e.target.value;
        saveLayoutDebounced(tab.turno, tab.turma);
        renderWalls(wrap, layout);
      });
      wrap.querySelector('#busca').addEventListener('input', function(e){
        var q = e.target.value.trim().toLowerCase();
        wrap.querySelectorAll('.desk').forEach(function(d){
          var name = (d.getAttribute('data-name')||'').toLowerCase();
          d.classList.toggle('match', !!q && name.indexOf(q) !== -1);
        });
      });
    });
  }

  function windowBlockHtml(){
    var pane = '<div class="window-pane"><span></span><span></span><span></span><span></span><span></span><span></span></div>';
    return '<div class="windows-block">' + pane + pane + pane + '</div>';
  }
  function doorGroupHtml(){
    return '<div class="door-group"><div class="door" title="Porta"></div></div>';
  }
  function renderWalls(wrap, layout){
    var left = wrap.querySelector('#wall-left');
    var right = wrap.querySelector('#wall-right');
    var leftHtml = '', rightHtml = '';
    if (layout.windowSide === 'left') leftHtml += windowBlockHtml();
    if (layout.windowSide === 'right') rightHtml += windowBlockHtml();
    // A porta fica sempre na parte de baixo da parede (voltada para a mesa do professor),
    // e sozinha nesse lado (sem mural), conforme pedido.
    if (layout.doorSide === 'left') leftHtml += doorGroupHtml();
    if (layout.doorSide === 'right') rightHtml += doorGroupHtml();
    left.innerHTML = leftHtml;
    right.innerHTML = rightHtml;
  }

  function deskInnerHtml(name, key){
    return (name ? '<span class="name">'+escapeHtml(name)+'</span>' : '<span class="name empty">Vazio</span>') +
      '<button type="button" class="seat-clear" data-key="'+key+'" title="Excluir esta mesa">✕</button>';
  }
  function attachClearBtnHandler(deskEl, tab, layout, wrap){
    var clearBtn = deskEl.querySelector('.seat-clear');
    if (!clearBtn) return;
    clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var k = this.getAttribute('data-key');
      layout.removed[k] = true;
      delete layout.seats[k];
      saveLayoutDebounced(tab.turno, tab.turma);
      buildDesksGrid(wrap, tab, layout);
      updateFilledCount(tab, layout);
    });
  }
  function attachSeatHandlers(seat, tab, layout, wrap){
    var deskEl = seat.querySelector('.desk');
    if (deskEl){
      deskEl.addEventListener('click', function(e){
        if (e.target && e.target.closest && e.target.closest('.seat-clear')) return;
        var canvas = wrap.querySelector('#room-canvas');
        if (!canvas || !canvas.classList.contains('edit-mode')) return; // só edita/marca em modo edição
        var state = roomUiState[tab.id];
        var tagMode = state && state.tagMode;
        if (tagMode === 'swap'){
          var kSwap = this.getAttribute('data-key');
          if (!state.swapFirstKey){
            state.swapFirstKey = kSwap;
            this.classList.add('swap-selected');
          } else if (state.swapFirstKey === kSwap){
            this.classList.remove('swap-selected');
            state.swapFirstKey = null;
          } else {
            var k1 = state.swapFirstKey, k2 = kSwap;
            var tmpSeat = layout.seats[k1];
            if (layout.seats[k2]) layout.seats[k1] = layout.seats[k2]; else delete layout.seats[k1];
            if (tmpSeat) layout.seats[k2] = tmpSeat; else delete layout.seats[k2];
            var tmpTag = layout.tags[k1];
            if (layout.tags[k2]) layout.tags[k1] = layout.tags[k2]; else delete layout.tags[k1];
            if (tmpTag) layout.tags[k2] = tmpTag; else delete layout.tags[k2];
            state.swapFirstKey = null;
            saveLayoutDebounced(tab.turno, tab.turma);
            buildDesksGrid(wrap, tab, layout);
            showToast('Lugares trocados!');
          }
          return;
        }
        if (tagMode){
          var k = this.getAttribute('data-key');
          if (layout.tags[k] === tagMode) delete layout.tags[k];
          else layout.tags[k] = tagMode;
          saveLayoutDebounced(tab.turno, tab.turma);
          buildDesksGrid(wrap, tab, layout);
          return;
        }
        activateDeskEdit(this, tab, layout, wrap);
      });
      attachClearBtnHandler(deskEl, tab, layout, wrap);
    }
    var restoreBtn = seat.querySelector('.restore-btn');
    if (restoreBtn){
      restoreBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var k = this.getAttribute('data-key');
        delete layout.removed[k];
        saveLayoutDebounced(tab.turno, tab.turma);
        buildDesksGrid(wrap, tab, layout);
        updateFilledCount(tab, layout);
      });
    }
  }

  function fitDeskName(deskEl){
    var nameEl = deskEl.querySelector('.name');
    if (!nameEl || nameEl.classList.contains('empty')) return;
    var maxFont = 13.5, minFont = 7.5, step = 0.5;
    var fontSize = maxFont;
    nameEl.style.fontSize = fontSize + 'px';
    var guard = 0;
    while (guard < 14 && fontSize > minFont && nameEl.scrollHeight > nameEl.clientHeight + 1){
      fontSize -= step;
      nameEl.style.fontSize = fontSize + 'px';
      guard++;
    }
  }

  function buildDesksGrid(wrap, tab, layout){
    var grid = wrap.querySelector('#desks-grid');
    grid.style.gridTemplateColumns = 'repeat(' + layout.cols + ', 88px)';
    grid.style.gridTemplateRows = 'repeat(' + layout.rows + ', auto)';
    grid.innerHTML = '';

    for (var r = 0; r < layout.rows; r++){
      for (var c = 0; c < layout.cols; c++){
        var key = r + '_' + c;
        var seat = document.createElement('div');

        if (layout.removed[key]){
          seat.className = 'seat seat-removed';
          seat.innerHTML =
            '<div class="empty-slot">' +
              '<button type="button" class="restore-btn" data-key="'+key+'" title="Recolocar mesa aqui">+</button>' +
            '</div>';
        } else {
          var name = layout.seats[key] || '';
          var tag = layout.tags[key] || '';
          seat.className = 'seat';
          seat.innerHTML =
            '<div class="chair"></div>' +
            '<div class="desk'+(name?' filled':'')+(tag?' tag-'+tag:'')+'" data-name="'+escapeHtml(name)+'" data-key="'+key+'">' +
              deskInnerHtml(name, key) +
            '</div>' +
            '<div class="idx">'+(r+1)+'-'+(c+1)+'</div>';
        }
        grid.appendChild(seat);
        attachSeatHandlers(seat, tab, layout, wrap);
        var deskForFit = seat.querySelector('.desk');
        if (deskForFit) fitDeskName(deskForFit);
      }
    }
  }

  function activateDeskEdit(deskEl, tab, layout, wrap){
    if (deskEl.classList.contains('editing')) return;
    var key = deskEl.getAttribute('data-key');
    var current = layout.seats[key] || '';
    deskEl.classList.add('editing');
    deskEl.innerHTML = '<input type="text" maxlength="40" placeholder="Nome do aluno" value="'+escapeHtml(current)+'">';
    var input = deskEl.querySelector('input');
    input.focus();
    input.select();

    function commit(){
      var val = input.value.trim();
      if (val) layout.seats[key] = val; else delete layout.seats[key];
      deskEl.classList.remove('editing');
      deskEl.classList.toggle('filled', !!val);
      deskEl.setAttribute('data-name', val);
      deskEl.innerHTML = deskInnerHtml(val, key);
      attachClearBtnHandler(deskEl, tab, layout, wrap);
      fitDeskName(deskEl);
      saveLayoutDebounced(tab.turno, tab.turma);
      updateFilledCount(tab, layout);
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); input.blur(); }
      if (e.key === 'Escape'){ input.value = current; input.blur(); }
    });
  }

  function updateFilledCount(tab, layout){
    var metaEl = document.querySelector('.toolbar .meta');
    if (!metaEl) return;
    var removedCount = Object.keys(layout.removed).filter(function(k){
      var parts = k.split('_'); var rr = +parts[0], cc = +parts[1];
      return rr < layout.rows && cc < layout.cols && layout.removed[k];
    }).length;
    var total = (layout.rows * layout.cols) - removedCount;
    var filled = Object.keys(layout.seats).filter(function(k){
      return (layout.seats[k]||'').trim() && !layout.removed[k];
    }).length;
    var info = turnoInfo(tab.turno);
    metaEl.innerHTML = '<span class="badge" style="background:'+info.color+'">'+info.label+'</span>' + filled + ' de ' + total + ' assentos preenchidos';
  }

  function setupPwaManifest(){
    try{
      var iconUri = 'data:image/svg+xml;utf8,' + encodeURIComponent(pwaIconSvg());
      var baseUrl = location.href.split('#')[0].split('?')[0];
      var scopeUrl = baseUrl.replace(/[^\/]*$/, '');
      var manifest = {
        name: 'Mapa de Sala — E.E.E.F.M. Ilda Ferreira da Fonseca Martins',
        short_name: 'Mapa de Sala',
        description: 'Mapa de sala por turno e turma da E.E.E.F.M. Ilda Ferreira da Fonseca Martins.',
        start_url: baseUrl,
        scope: scopeUrl,
        display: 'standalone',
        background_color: '#152B1E',
        theme_color: '#152B1E',
        lang: 'pt-BR',
        icons: [
          { src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
          { src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }
        ]
      };
      var blob = JSON.stringify(manifest);
      var url = 'data:application/manifest+json,' + encodeURIComponent(blob);
      var link = document.getElementById('manifest-link');
      if (link) link.setAttribute('href', url);
      var appleIcon = document.getElementById('apple-touch-icon');
      if (appleIcon) appleIcon.setAttribute('href', iconUri);
    } catch(e){ console.warn('Manifest do PWA indisponível:', e); }
  }

  function setupInstallButton(){
    var btn = document.getElementById('btn-install');
    if (!btn) return;
    var deferredPrompt = null;
    var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      window.navigator.standalone === true;
    if (isStandalone) return; // já rodando como app instalado — mantém o botão escondido

    var isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent || '');

    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      btn.hidden = false;
    });
    window.addEventListener('appinstalled', function(){
      btn.hidden = true;
      deferredPrompt = null;
      showToast('App instalado com sucesso!');
    });
    // iOS/Safari nunca dispara beforeinstallprompt — mostramos o botão com instruções manuais.
    if (isIOS) btn.hidden = false;

    btn.addEventListener('click', function(){
      if (deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(){ deferredPrompt = null; });
        return;
      }
      if (isIOS){
        alert('Para instalar no iPhone/iPad:\n\n1. Toque no ícone de Compartilhar (quadrado com seta para cima)\n2. Escolha "Adicionar à Tela de Início"');
      } else {
        alert('Para instalar:\n\nAbra o menu do navegador (⋮ ou •••) e escolha "Instalar app" ou "Adicionar à tela inicial".\n\nEssa opção só aparece quando a página está hospedada em um endereço da internet — não funciona com o arquivo aberto direto da pasta Downloads.');
      }
    });
  }

  function setupServiceWorker(){
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return; // não suportado em file://
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('Service worker não registrado (o arquivo sw.js precisa estar hospedado na mesma pasta):', err);
      });
    });
  }

  window.mapaDeSalaDebug = function(){
    var info = {
      modoDeArmazenamento: STORAGE_MODE,
      storeVerificado: STORE_VERIFIED,
      firebaseConfigPreenchida: isFirebaseConfigured(),
      firebaseSdkCarregado: (typeof firebase !== 'undefined'),
      urlDaPagina: location.href
    };
    console.log('[Mapa de Sala] Diagnóstico:', info);
    return info;
  };
  console.log('[Mapa de Sala] Digite mapaDeSalaDebug() no console para diagnosticar o armazenamento.');
  console.log('[Mapa de Sala] Modo de armazenamento ativo no carregamento:', STORAGE_MODE, '| Firebase configurado:', isFirebaseConfigured());

  renderTabs();
  renderMain();
  setupPwaManifest();
  setupInstallButton();
  setupServiceWorker();
  if (STORAGE_MODE === 'memory'){
    setTimeout(function(){
      showToast('Atenção: este navegador não permite salvar dados — os mapas serão perdidos ao fechar a página.');
    }, 600);
  } else if (STORAGE_MODE === 'cloud' || STORAGE_MODE === 'firebase'){
    // Verifica em segundo plano, sem travar a tela, se o armazenamento realmente responde.
    ensureStoreVerified();
  }

})();
</script>
</body>
</html>
